<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bincom Election Results Portal - View and manage polling unit and LGA election results.">
    <title>{% block title %}Election Results Portal{% endblock %} | Bincom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0d0f14;
            --surface: #161a22;
            --surface-2: #1e2430;
            --border: #2a3040;
            --accent: #4f8ef7;
            --accent-glow: rgba(79, 142, 247, 0.18);
            --green: #34d399;
            --green-glow: rgba(52, 211, 153, 0.15);
            --red: #f87171;
            --red-glow: rgba(248, 113, 113, 0.15);
            --text: #e2e8f0;
            --muted: #64748b;
            --radius: 12px;
            --transition: 0.2s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* NAV */
        nav {
            background: rgba(22, 26, 34, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .nav-brand .logo-dot {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #4f8ef7, #8b5cf6);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }
        .nav-brand span {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .nav-links {
            display: flex;
            gap: 4px;
        }
        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 14px;
            border-radius: 8px;
            transition: var(--transition);
        }
        .nav-links a:hover { color: var(--text); background: var(--surface-2); }
        .nav-links a.active { color: var(--accent); background: var(--accent-glow); }

        /* MAIN */
        main { max-width: 900px; margin: 0 auto; padding: 48px 24px 80px; }

        /* PAGE HEADER */
        .page-header { margin-bottom: 36px; }
        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .page-header p { color: var(--muted); font-size: 15px; }

        /* CARD */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            margin-bottom: 24px;
        }
        .card-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--muted);
            margin-bottom: 20px;
        }

        /* FORM */
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 8px;
        }
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 11px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
            outline: none;
        }
        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        select option { background: var(--surface); }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 22px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover {
            background: #3b7de8;
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(79, 142, 247, 0.4);
        }
        .btn-primary:active { transform: translateY(0); }

        /* RESULTS TABLE */
        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 4px;
        }
        .results-table th {
            text-align: left;
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
        }
        .results-table td {
            padding: 13px 14px;
            font-size: 14px;
            border-bottom: 1px solid rgba(42, 48, 64, 0.5);
        }
        .results-table tr:last-child td { border-bottom: none; }
        .results-table tr:hover td { background: var(--surface-2); }

        .party-badge {
            display: inline-block;
            padding: 3px 10px;
            background: var(--accent-glow);
            color: var(--accent);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .score-value {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        /* SCORE BAR */
        .score-bar-wrap { display: flex; align-items: center; gap: 12px; }
        .score-bar-bg {
            flex: 1;
            height: 6px;
            background: var(--surface-2);
            border-radius: 3px;
            overflow: hidden;
        }
        .score-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4f8ef7, #8b5cf6);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        /* ALERTS */
        .alert {
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .alert-success { background: var(--green-glow); color: var(--green); border: 1px solid rgba(52, 211, 153, 0.2); }
        .alert-error   { background: var(--red-glow);   color: var(--red);   border: 1px solid rgba(248, 113, 113, 0.2); }
        .alert-info    { background: var(--accent-glow); color: var(--accent); border: 1px solid rgba(79,142,247,0.2); }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--muted);
        }
        .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
        .empty-state p { font-size: 15px; }

        /* STATS ROW */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }
        .stat-card .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }
        .stat-card .stat-value { font-size: 26px; font-weight: 700; }

        /* HERO (index) */
        .hero {
            text-align: center;
            padding: 64px 0 48px;
        }
        .hero h1 {
            font-size: 40px;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #e2e8f0 30%, #4f8ef7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 14px;
        }
        .hero p { color: var(--muted); font-size: 17px; max-width: 500px; margin: 0 auto 40px; }
        .feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
        .feature-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            text-decoration: none;
            color: var(--text);
            transition: var(--transition);
            text-align: left;
        }
        .feature-card:hover {
            border-color: var(--accent);
            background: var(--surface-2);
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(79,142,247,0.15);
        }
        .feature-card .icon { font-size: 28px; margin-bottom: 14px; }
        .feature-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        .feature-card p { font-size: 13px; color: var(--muted); line-height: 1.5; }
        .feature-card .arrow { color: var(--accent); margin-top: 16px; font-size: 13px; font-weight: 500; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="/" class="nav-brand">
                <div class="logo-dot">🗳</div>
                <span>ElectResults</span>
            </a>
            <div class="nav-links">
                <a href="/" {% if request.endpoint == 'index' %}class="active"{% endif %}>Home</a>
                <a href="/polling_unit_result" {% if request.endpoint == 'polling_unit_result' %}class="active"{% endif %}>Polling Unit</a>
                <a href="/lga_result" {% if request.endpoint == 'lga_result' %}class="active"{% endif %}>LGA Results</a>
                <a href="/store_result" {% if request.endpoint == 'store_result' %}class="active"{% endif %}>Store Result</a>
            </div>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
